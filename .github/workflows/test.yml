name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Dictator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: seuros/setup-dictator@master
        with:
          version: '0.26.0'
      - run: dictator lint --format github .

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          # rb-sys gates part of the magnus API on the Ruby it builds against,
          # so the binding crate needs a Ruby here even though the core does not.
          mise_toml: |
            [tools]
            ruby = "4.0"
            rust = { version = "1.99", components = "clippy,rustfmt" }

      - name: Lint the workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test the core crate
        run: cargo test --workspace

      - name: Run doc tests
        run: cargo test --workspace --doc

      - name: Check formatting
        run: cargo fmt --all --check

  bare-metal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            rust = { version = "1.99", components = "clippy", targets = "thumbv7em-none-eabihf" }

      - name: Locate the core crate
        id: crates
        run: |
          core=''
          for dir in ext/*/core; do [ -d "$dir" ] && core="$dir"; done
          echo "core=$core" >> "$GITHUB_OUTPUT"

      - name: Build and lint on bare metal
        working-directory: ${{ steps.crates.outputs.core }}
        run: |
          cargo build --target thumbv7em-none-eabihf
          cargo clippy --target thumbv7em-none-eabihf -- -D warnings

  ruby:
    runs-on: ubuntu-latest
    env:
      BUNDLE_PATH: vendor/bundle
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          mise_toml: |
            [tools]
            ruby = "4.0"
            rust = { version = "1.99", components = "clippy,rustfmt" }

      - name: Cache gems
        uses: actions/cache@v6
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('Gemfile', '*.gemspec') }}

      - name: Install gems
        run: bundle install --jobs 4

      - name: Run tests
        run: bundle exec rake test

      - name: Validate signatures
        run: bundle exec rbs -I sig validate
