[workspace]
members = ["ext/window_machines_native/core", "ext/window_machines_native/ffi"]
default-members = ["ext/window_machines_native/core"]
resolver = "3"
[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "MIT"
[workspace.dependencies]
window-machines = { path = "ext/window_machines_native/core" }
matryona-machines = { version = ">=0.3", default-features = false }
magnus = { version = "0.9.3", default-features = false }
rb-sys = { version = "0.9.130", default-features = false, features = ["stable-api-compiled-fallback"] }
[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "warn"
missing_docs = "warn"
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
